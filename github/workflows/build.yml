name: Build Reelhouse APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Reelhouse" "com.reelhouse.player" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew 
assembleDebug

      - name: Publish the APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Reelhouse.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest Reelhouse.apk --repo "$GITHUB_REPOSITORY" --title "Reelhouse" --notes "Latest build. Download Reelhouse.apk and install it."
